<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="夜空のような背景に、10個の星の名前が入った円が上下2段に並んでいる。上の段は比肩・食神・偏財・偏官・偏印、下の段は劫財・傷官・正財・正官・印綬。まん中に「10人の星のキャラクター」と書かれている">
