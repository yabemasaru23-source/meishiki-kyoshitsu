<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="10の星のキャラクター一覧。横に5つのグループが並ぶ。仲間の星は比肩（わが道ランナー）と劫財（勝負キャプテン）、表現の星は食神（ごきげん料理人）と傷官（するどい芸術家）、財の星は偏財（顔の広い旅人）と正財（コツコツ管理人）、官の星は偏官（かけつけ隊長）と正官（信頼の委員長）、印の星は偏印（ひらめき発明家）と印綬（学び好きの学者）。上の段は陰陽が同じでかたよる星（一点集中・型やぶり）、下の段は陰陽がちがってととのう星（安定・型どおり）">
