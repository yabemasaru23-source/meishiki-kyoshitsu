<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="命式の教室の黒板。黒板には「命式の教室」の文字と、左から乙未・辛酉・丁巳・戊寅の4本の柱がチョークで書かれ、日柱の辛だけが金色。左には命・卜・相と書かれた3冊の本が積まれ、右では白黒もようのネコのまあ先生がほほえんでいる">
<defs>
  <clipPath id="c00-head"><ellipse cx="60" cy="64" rx="42" ry="38"/></clipPath>
</defs>
<rect width="800" height="320" fill="var(--sunk, #efe8dc)"/>
<path d="M0 262 H800 V320 H0Z" fill="var(--sun-soft, #f6ead0)"/>
<g stroke-linecap="round" stroke-linejoin="round">
  <!-- 黒板 -->
  <rect x="150" y="36" width="420" height="196" rx="10" fill="#2f4a3c" stroke="#a87018" stroke-width="8"/>
  <rect x="170" y="232" width="380" height="10" rx="3" fill="#a87018"/>
  <rect x="470" y="226" width="26" height="7" rx="2" fill="#fbf8f2"/>
  <g font-family="Zen Old Mincho, serif" font-weight="900" text-anchor="middle">
    <text x="360" y="86" font-size="30" fill="#fbf8f2">命式の教室</text>
    <g font-size="36" fill="#e9efe9">
      <text x="240" y="150">乙</text><text x="240" y="196">未</text>
      <text x="320" y="150" fill="#f3d68d">辛</text><text x="320" y="196">酉</text>
      <text x="400" y="150">丁</text><text x="400" y="196">巳</text>
      <text x="480" y="150">戊</text><text x="480" y="196">寅</text>
    </g>
  </g>
  <path d="M280 108 V212 M360 108 V212 M440 108 V212" stroke="#7f9a88" stroke-width="1.5" stroke-dasharray="3 6"/>
  <!-- 本（命・卜・相） -->
  <g font-family="Zen Old Mincho, serif" font-weight="900" font-size="17" text-anchor="middle" fill="#fbf8f2">
    <rect x="34" y="238" width="96" height="24" rx="3" fill="var(--sun, #d9a441)" stroke="#26221d" stroke-width="2"/>
    <text x="82" y="256" fill="#26221d">命</text>
    <rect x="42" y="214" width="84" height="24" rx="3" fill="var(--sui, #2854a0)" stroke="#26221d" stroke-width="2"/>
    <text x="84" y="232">卜</text>
    <rect x="38" y="190" width="88" height="24" rx="3" fill="var(--moku, #2d7a4a)" stroke="#26221d" stroke-width="2"/>
    <text x="82" y="208">相</text>
  </g>
  <!-- まあ先生 -->
  <g transform="translate(606 84) scale(1.5)">
    <path d="M22 46 L26 10 L52 32 Z" fill="#fbf8f2" stroke="#26221d" stroke-width="3"/>
    <path d="M30 38 L31 20 L45 32 Z" fill="#f2b7b0"/>
    <path d="M98 46 L94 10 L68 32 Z" fill="#26221d" stroke="#26221d" stroke-width="3"/>
    <path d="M90 38 L89 20 L75 32 Z" fill="#6a5a6e"/>
    <ellipse cx="60" cy="64" rx="42" ry="38" fill="#fbf8f2"/>
    <g clip-path="url(#c00-head)">
      <path d="M60 20 C78 34 42 50 60 64 C78 78 42 94 60 108 L110 108 L110 20 Z" fill="#26221d"/>
    </g>
    <ellipse cx="60" cy="64" rx="42" ry="38" fill="none" stroke="#26221d" stroke-width="3"/>
    <path d="M35 60 q7 -8 14 0" fill="none" stroke="#26221d" stroke-width="3"/>
    <path d="M71 60 q7 -8 14 0" fill="none" stroke="#f3d68d" stroke-width="3"/>
    <path d="M56 72 L64 72 L60 77 Z" fill="#e58a8a"/>
    <path d="M60 77 q-5 6 -10 2 M60 77 q5 6 10 2" fill="none" stroke="#8a7f74" stroke-width="2.2"/>
    <path d="M30 74 L12 70 M30 79 L13 82" stroke="#8a7f74" stroke-width="1.8"/>
    <path d="M90 74 L108 70 M90 79 L107 82" stroke="#d6cfc4" stroke-width="1.8"/>
    <ellipse cx="34" cy="70" rx="5" ry="3.2" fill="#f2b7b0" opacity=".8"/>
    <g transform="translate(60 40)">
      <circle r="6.5" fill="#fbf8f2" stroke="#d9a441" stroke-width="1.6"/>
      <path d="M0 -6.5 A6.5 6.5 0 0 1 0 6.5 A3.25 3.25 0 0 1 0 0 A3.25 3.25 0 0 0 0 -6.5 Z" fill="#26221d"/>
      <circle cy="-3.25" r="1.1" fill="#26221d"/>
      <circle cy="3.25" r="1.1" fill="#fbf8f2"/>
    </g>
    <path d="M36 98 q24 10 48 0" fill="none" stroke="#c03430" stroke-width="4"/>
    <circle cx="60" cy="106" r="5.5" fill="#d9a441" stroke="#26221d" stroke-width="1.6"/>
    <path d="M57 107 h6" stroke="#26221d" stroke-width="1.4"/>
  </g>
</g>
</svg>
