<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-label="10の日干のたとえ。たてに木・火・土・金・水の5列、よこに陽と陰の2段。木は陽が甲の大樹、陰が乙の草花。火は陽が丙の太陽、陰が丁の灯火。土は陽が戊の山、陰が己の田畑。金は陽が庚の鉄・刀、陰が辛の宝石。水は陽が壬の大海、陰が癸の雨・露">
<rect width="800" height="390" rx="18" fill="var(--surface, #fffdf8)"/>
<g font-family="Zen Maru Gothic, sans-serif" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round">
  <!-- 列の見出し -->
  <g font-size="22" font-weight="700" font-family="Zen Old Mincho, serif">
    <text x="146" y="50" fill="var(--moku, #2d7a4a)">木</text>
    <text x="288" y="50" fill="var(--ka, #c03430)">火</text>
    <text x="430" y="50" fill="var(--do, #a87018)">土</text>
    <text x="572" y="50" fill="var(--kin, #6b7584)">金</text>
    <text x="714" y="50" fill="var(--sui, #2854a0)">水</text>
  </g>
  <!-- 段の見出し -->
  <g font-size="16" font-weight="700" fill="var(--ink-soft, #6a6157)">
    <text x="38" y="138">陽</text><text x="38" y="158" font-size="13">（＋）</text>
    <text x="38" y="294">陰</text><text x="38" y="314" font-size="13">（−）</text>
  </g>
  <!-- マス -->
  <g fill="var(--sunk, #efe8dc)">
    <rect x="79" y="66" width="134" height="146" rx="12"/><rect x="221" y="66" width="134" height="146" rx="12"/><rect x="363" y="66" width="134" height="146" rx="12"/><rect x="505" y="66" width="134" height="146" rx="12"/><rect x="647" y="66" width="134" height="146" rx="12"/>
    <rect x="79" y="222" width="134" height="146" rx="12"/><rect x="221" y="222" width="134" height="146" rx="12"/><rect x="363" y="222" width="134" height="146" rx="12"/><rect x="505" y="222" width="134" height="146" rx="12"/><rect x="647" y="222" width="134" height="146" rx="12"/>
  </g>

  <!-- 絵（陽の段：中心 y=106） -->
  <!-- 甲 大樹 -->
  <g transform="translate(146 106)">
    <rect x="-5" y="2" width="10" height="26" fill="#8a6a4a"/>
    <circle cx="0" cy="-8" r="22" fill="#dcefe2" stroke="var(--moku, #2d7a4a)" stroke-width="3"/>
  </g>
  <!-- 丙 太陽 -->
  <g transform="translate(288 106)" stroke="var(--ka, #c03430)" stroke-width="3">
    <circle r="14" fill="#f6c9b8"/>
    <path d="M0 -22 V-28 M0 22 V28 M-22 0 H-28 M22 0 H28 M-16 -16 L-20 -20 M16 16 L20 20 M16 -16 L20 -20 M-16 16 L-20 20"/>
  </g>
  <!-- 戊 山 -->
  <g transform="translate(430 106)">
    <path d="M-30 24 L-6 -22 L6 -6 L14 -16 L32 24 Z" fill="#ecd9b0" stroke="var(--do, #a87018)" stroke-width="3"/>
  </g>
  <!-- 庚 鉄・刀 -->
  <g transform="translate(572 106)" stroke="var(--kin, #6b7584)" stroke-width="3">
    <path d="M-20 20 L18 -18 L24 -26 L16 -20 L-14 14 Z" fill="#e3e6ea"/>
    <path d="M-24 10 L-10 24" />
    <path d="M-18 18 L-26 26"/>
  </g>
  <!-- 壬 大海 -->
  <g transform="translate(714 106)" fill="none" stroke="var(--sui, #2854a0)" stroke-width="3">
    <path d="M-30 -8 q7.5 -10 15 0 t15 0 t15 0 t15 0"/>
    <path d="M-30 6 q7.5 -10 15 0 t15 0 t15 0 t15 0"/>
    <path d="M-30 20 q7.5 -10 15 0 t15 0 t15 0 t15 0"/>
  </g>

  <!-- 絵（陰の段：中心 y=262） -->
  <!-- 乙 草花 -->
  <g transform="translate(146 262)" stroke="var(--moku, #2d7a4a)" stroke-width="3">
    <path d="M0 28 V-4 M0 14 Q-14 8 -16 -4 M0 18 Q12 12 14 2" fill="none"/>
    <g fill="#f6d0dc" stroke="#c0607e" stroke-width="2">
      <circle cx="0" cy="-20" r="6"/><circle cx="-8" cy="-12" r="6"/><circle cx="8" cy="-12" r="6"/><circle cx="-5" cy="-4" r="5"/><circle cx="5" cy="-4" r="5"/>
    </g>
    <circle cx="0" cy="-11" r="4" fill="var(--sun, #d9a441)" stroke="none"/>
  </g>
  <!-- 丁 灯火 -->
  <g transform="translate(288 262)">
    <rect x="-8" y="0" width="16" height="26" rx="2" fill="#fffdf8" stroke="var(--ka, #c03430)" stroke-width="3"/>
    <path d="M0 -4 C-9 -4 -10 -14 -4 -20 C-2 -14 0 -16 0 -26 C6 -20 10 -12 8 -8 C6 -5 3 -4 0 -4 Z" fill="var(--sun, #d9a441)" stroke="var(--ka, #c03430)" stroke-width="2"/>
  </g>
  <!-- 己 田畑 -->
  <g transform="translate(430 262)">
    <rect x="-30" y="-18" width="60" height="40" rx="4" fill="#ecd9b0" stroke="var(--do, #a87018)" stroke-width="3"/>
    <path d="M-30 -5 H30 M-30 8 H30 M0 -18 V22" stroke="var(--do, #a87018)" stroke-width="2"/>
    <path d="M-20 -24 v-6 M-10 -24 v-8 M10 -24 v-8 M20 -24 v-6" stroke="var(--moku, #2d7a4a)" stroke-width="3"/>
  </g>
  <!-- 辛 宝石 -->
  <g transform="translate(572 262)">
    <path d="M-24 -8 L-12 -22 H12 L24 -8 L0 24 Z" fill="#e3e6ea" stroke="var(--kin, #6b7584)" stroke-width="3"/>
    <path d="M-24 -8 H24 M-12 -22 L-6 -8 L0 24 L6 -8 L12 -22" fill="none" stroke="var(--kin, #6b7584)" stroke-width="2"/>
  </g>
  <!-- 癸 雨・露 -->
  <g transform="translate(714 262)" fill="#cfdcf1" stroke="var(--sui, #2854a0)" stroke-width="2.5">
    <path d="M-14 -22 C-20 -12 -22 -6 -14 -4 C-6 -6 -8 -12 -14 -22 Z"/>
    <path d="M10 -14 C4 -4 2 2 10 4 C18 2 16 -4 10 -14 Z"/>
    <path d="M-4 6 C-10 16 -12 22 -4 24 C4 22 2 16 -4 6 Z"/>
  </g>

  <!-- 文字（陽の段） -->
  <g font-size="32" font-weight="700" font-family="Zen Old Mincho, serif">
    <text x="146" y="174" fill="var(--moku, #2d7a4a)">甲</text>
    <text x="288" y="174" fill="var(--ka, #c03430)">丙</text>
    <text x="430" y="174" fill="var(--do, #a87018)">戊</text>
    <text x="572" y="174" fill="var(--kin, #6b7584)">庚</text>
    <text x="714" y="174" fill="var(--sui, #2854a0)">壬</text>
    <text x="146" y="330" fill="var(--moku, #2d7a4a)">乙</text>
    <text x="288" y="330" fill="var(--ka, #c03430)">丁</text>
    <text x="430" y="330" fill="var(--do, #a87018)">己</text>
    <text x="572" y="330" fill="var(--kin, #6b7584)">辛</text>
    <text x="714" y="330" fill="var(--sui, #2854a0)">癸</text>
  </g>
  <g font-size="15" fill="var(--ink, #26221d)">
    <text x="146" y="200">大樹</text><text x="288" y="200">太陽</text><text x="430" y="200">山</text><text x="572" y="200">鉄・刀</text><text x="714" y="200">大海・大河</text>
    <text x="146" y="356">草花</text><text x="288" y="356">灯火</text><text x="430" y="356">田畑</text><text x="572" y="356">宝石</text><text x="714" y="356">雨・露</text>
  </g>
</g>
</svg>
