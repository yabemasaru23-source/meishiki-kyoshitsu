<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="占いの3つの種類を3枚のカードで並べた図。命（命術）は、生まれた年・月・日・時を見て、生まれ持った設計図がわかる。たとえると地図。例は四柱推命・算命学。この教室で学ぶのはこの命術。卜（卜術）は、その時の偶然の出方を見て、今の問いへの答えを出す。たとえると分かれ道の道しるべ。例はタロット・易・おみくじ。相（相術）は、手・顔・名前・家のかたちを見て、今の状態と整え方がわかる。たとえると鏡。例は手相・姓名判断・風水">
<rect width="800" height="380" rx="18" fill="var(--sunk, #efe8dc)"/>
<g font-family="Zen Maru Gothic, sans-serif" text-anchor="middle">
  <!-- 命 -->
  <g transform="translate(140 0)">
    <rect x="-120" y="20" width="240" height="340" rx="16" fill="var(--surface, #fffdf8)" stroke="var(--sun, #d9a441)" stroke-width="4"/>
    <rect x="48" y="30" width="64" height="24" rx="12" fill="var(--sun, #d9a441)"/>
    <text x="80" y="47" font-size="13" font-weight="700" fill="var(--ink, #26221d)">この教室</text>
    <text y="96" font-size="56" font-weight="900" font-family="Zen Old Mincho, serif" fill="var(--ink, #26221d)">命</text>
    <text y="134" font-size="18" font-weight="700" fill="var(--ink, #26221d)">命術（めいじゅつ）</text>
    <path d="M-90 150 H90" stroke="var(--sunk, #efe8dc)" stroke-width="2"/>
    <text y="176" font-size="13" fill="var(--ink-soft, #6a6157)">見るもの</text>
    <text y="198" font-size="16" fill="var(--ink, #26221d)">生まれた年・月・日・時</text>
    <text y="228" font-size="13" fill="var(--ink-soft, #6a6157)">わかること</text>
    <text y="250" font-size="16" fill="var(--ink, #26221d)">生まれ持った「設計図」</text>
    <text y="280" font-size="13" fill="var(--ink-soft, #6a6157)">たとえると</text>
    <text y="304" font-size="18" font-weight="700" fill="var(--ink, #26221d)">地図</text>
    <text y="338" font-size="14" fill="var(--ink-soft, #6a6157)">例：四柱推命・算命学</text>
  </g>
  <!-- 卜 -->
  <g transform="translate(400 0)">
    <rect x="-120" y="20" width="240" height="340" rx="16" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="2"/>
    <text y="96" font-size="56" font-weight="900" font-family="Zen Old Mincho, serif" fill="var(--ink, #26221d)">卜</text>
    <text y="134" font-size="18" font-weight="700" fill="var(--ink, #26221d)">卜術（ぼくじゅつ）</text>
    <path d="M-90 150 H90" stroke="var(--sunk, #efe8dc)" stroke-width="2"/>
    <text y="176" font-size="13" fill="var(--ink-soft, #6a6157)">見るもの</text>
    <text y="198" font-size="16" fill="var(--ink, #26221d)">その時の「偶然」の出方</text>
    <text y="228" font-size="13" fill="var(--ink-soft, #6a6157)">わかること</text>
    <text y="250" font-size="16" fill="var(--ink, #26221d)">今の問いへの答え</text>
    <text y="280" font-size="13" fill="var(--ink-soft, #6a6157)">たとえると</text>
    <text y="304" font-size="18" font-weight="700" fill="var(--ink, #26221d)">分かれ道の道しるべ</text>
    <text y="338" font-size="14" fill="var(--ink-soft, #6a6157)">例：タロット・易・おみくじ</text>
  </g>
  <!-- 相 -->
  <g transform="translate(660 0)">
    <rect x="-120" y="20" width="240" height="340" rx="16" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="2"/>
    <text y="96" font-size="56" font-weight="900" font-family="Zen Old Mincho, serif" fill="var(--ink, #26221d)">相</text>
    <text y="134" font-size="18" font-weight="700" fill="var(--ink, #26221d)">相術（そうじゅつ）</text>
    <path d="M-90 150 H90" stroke="var(--sunk, #efe8dc)" stroke-width="2"/>
    <text y="176" font-size="13" fill="var(--ink-soft, #6a6157)">見るもの</text>
    <text y="198" font-size="15" fill="var(--ink, #26221d)">手・顔・名前・家の「かたち」</text>
    <text y="228" font-size="13" fill="var(--ink-soft, #6a6157)">わかること</text>
    <text y="250" font-size="16" fill="var(--ink, #26221d)">今の状態と、整え方</text>
    <text y="280" font-size="13" fill="var(--ink-soft, #6a6157)">たとえると</text>
    <text y="304" font-size="18" font-weight="700" fill="var(--ink, #26221d)">鏡</text>
    <text y="338" font-size="14" fill="var(--ink-soft, #6a6157)">例：手相・姓名判断・風水</text>
  </g>
</g>
</svg>
