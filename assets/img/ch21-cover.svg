<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="テーブルをはさんで、2つの湯のみが向かい合っている。左のふきだしは「どんなことで迷っているの？」と聞き、右のふきだしは「じつは、ね…」と話しはじめている。テーブルのまん中には、4本の柱が並んだ命式のカードが置かれている">
<rect width="800" height="320" fill="var(--sun-soft, #f6ead0)"/>
<path d="M0 270 H800 V320 H0Z" fill="var(--sunk, #efe8dc)"/>
<g font-family="Zen Maru Gothic, sans-serif" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round">
  <!-- 左のふきだし -->
  <path d="M110 46 H300 Q320 46 320 66 V106 Q320 126 300 126 H244 L230 146 L222 126 H110 Q90 126 90 106 V66 Q90 46 110 46Z" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="2.5"/>
  <text x="205" y="80" font-size="20" fill="var(--ink, #26221d)">どんなことで</text>
  <text x="205" y="110" font-size="20" fill="var(--ink, #26221d)">迷っているの？</text>
  <!-- 右のふきだし -->
  <path d="M520 66 H680 Q700 66 700 86 V106 Q700 126 680 126 H584 L570 146 L562 126 H520 Q500 126 500 106 V86 Q500 66 520 66Z" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="2.5"/>
  <text x="600" y="104" font-size="20" fill="var(--ink, #26221d)">じつは、ね…</text>
  <!-- 湯気 -->
  <g fill="none" stroke="var(--ink-soft, #6a6157)" stroke-width="2.5" opacity=".6">
    <path d="M222 184 q-6 -8 0 -14 t0 -14"/><path d="M238 184 q-6 -8 0 -14 t0 -14"/>
    <path d="M562 184 q-6 -8 0 -14 t0 -14"/><path d="M578 184 q-6 -8 0 -14 t0 -14"/>
  </g>
  <!-- 左の湯のみ -->
  <path d="M202 192 H258 L252 234 Q250 236 246 236 H214 Q210 236 208 234Z" fill="var(--moku, #2d7a4a)"/>
  <path d="M206 204 H254" stroke="var(--surface, #fffdf8)" stroke-width="3"/>
  <!-- 右の湯のみ -->
  <path d="M542 192 H598 L592 234 Q590 236 586 236 H554 Q550 236 548 234Z" fill="var(--sui, #2854a0)"/>
  <path d="M546 204 H594" stroke="var(--surface, #fffdf8)" stroke-width="3"/>
  <!-- 命式カード -->
  <rect x="330" y="140" width="140" height="96" rx="8" fill="var(--surface, #fffdf8)" stroke="var(--sun, #d9a441)" stroke-width="3"/>
  <path d="M365 152 V228 M400 152 V228 M435 152 V228" stroke="var(--sunk, #efe8dc)" stroke-width="2"/>
  <g font-family="Zen Old Mincho, serif" font-weight="700" font-size="20">
    <text x="347.5" y="182" fill="var(--moku, #2d7a4a)">乙</text><text x="347.5" y="216" fill="var(--do, #a87018)">未</text>
    <text x="382.5" y="182" fill="var(--kin, #6b7584)">辛</text><text x="382.5" y="216" fill="var(--kin, #6b7584)">酉</text>
    <text x="417.5" y="182" fill="var(--ka, #c03430)">丁</text><text x="417.5" y="216" fill="var(--ka, #c03430)">巳</text>
    <text x="452.5" y="182" fill="var(--do, #a87018)">戊</text><text x="452.5" y="216" fill="var(--moku, #2d7a4a)">寅</text>
  </g>
  <!-- テーブル -->
  <rect x="110" y="236" width="580" height="16" rx="8" fill="var(--do, #a87018)"/>
  <path d="M150 252 V300 M650 252 V300" stroke="var(--do, #a87018)" stroke-width="10"/>
</g>
</svg>
