<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="あたたかい色の背景に、ひよりさんの命式の8文字（右から年柱 戊寅・月柱 丁巳・日柱 辛酉・時柱 乙未）が並んだ表。日柱の上の辛と、年柱の下の寅のマスの角に、小さな金色の星の印がついている。右には「天乙貴人［年柱］」「天徳貴人［日柱（天干）］」の札。上に「特殊星は、命式にひそむ小さな印」と書かれている">
