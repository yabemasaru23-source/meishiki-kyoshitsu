<rect x="648" y="458" width="52" height="32" rx="6" fill="var(--sunk, #efe8dc)"/>
<text x="428" y="520" font-size="14" font-weight="700" fill="var(--do, #a87018)">魁罡</text>
<text x="428" y="568" font-size="12" fill="var(--ink-soft, #6a6157)">日柱が 庚辰・庚戌・壬辰・戊戌 のどれかなら出る</text>
<text x="428" y="588" font-size="12" fill="var(--ink-soft, #6a6157)">札：［日柱］</text>
</g>
