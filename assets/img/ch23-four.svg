<text x="168" y="152" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">日柱</text>
<rect x="142" y="160" width="52" height="32" rx="6" fill="var(--sun-soft, #f6ead0)" stroke="var(--sun, #d9a441)" stroke-width="2.5"/><text x="168" y="181" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink, #26221d)">日干</text>
<rect x="142" y="198" width="52" height="32" rx="6" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2" stroke-dasharray="5 4"/><text x="168" y="219" font-size="12" text-anchor="middle" fill="var(--sui, #2854a0)">？</text>
<text x="226" y="152" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">月柱</text>
<rect x="200" y="160" width="52" height="32" rx="6" fill="var(--sunk, #efe8dc)"/>
<rect x="200" y="198" width="52" height="32" rx="6" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2" stroke-dasharray="5 4"/><text x="226" y="219" font-size="12" text-anchor="middle" fill="var(--sui, #2854a0)">？</text>
<text x="284" y="152" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">年柱</text>
<rect x="258" y="160" width="52" height="32" rx="6" fill="var(--sunk, #efe8dc)"/>
<rect x="258" y="198" width="52" height="32" rx="6" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2" stroke-dasharray="5 4"/><text x="284" y="219" font-size="12" text-anchor="middle" fill="var(--sui, #2854a0)">？</text>
<text x="38" y="260" font-size="14" font-weight="700" fill="var(--do, #a87018)">天乙貴人・文昌貴人・金輿禄</text>
<text x="38" y="282" font-size="14" font-weight="700" fill="var(--do, #a87018)">暗禄・羊刃</text>
<text x="38" y="308" font-size="12" fill="var(--ink-soft, #6a6157)">日柱の地支も、さがす場所に入る</text>
<text x="38" y="328" font-size="12" fill="var(--ink-soft, #6a6157)">札：［年柱］のように、見つかった柱</text>
<rect x="410" y="96" width="370" height="246" rx="14" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="1.5"/>
<text x="428" y="126" font-size="16" font-weight="700" fill="var(--ink, #26221d)">② 月支 から、干と支を見る</text>
<text x="428" y="183" font-size="12" fill="var(--ink-soft, #6a6157)">天干</text><text x="428" y="221" font-size="12" fill="var(--ink-soft, #6a6157)">地支</text>
<text x="500" y="152" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">時柱</text>
<rect x="474" y="160" width="52" height="32" rx="6" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2" stroke-dasharray="5 4"/><text x="500" y="181" font-size="12" text-anchor="middle" fill="var(--sui, #2854a0)">？</text>
<rect x="474" y="198" width="52" height="32" rx="6" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2" stroke-dasharray="5 4"/><text x="500" y="219" font-size="12" text-anchor="middle" fill="var(--sui, #2854a0)">？</text>
<text x="558" y="152" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">日柱</text>
<rect x="532" y="160" width="52" height="32" rx="6" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2" stroke-dasharray="5 4"/><text x="558" y="181" font-size="12" text-anchor="middle" fill="var(--sui, #2854a0)">？</text>
