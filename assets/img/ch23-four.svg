<text x="226" y="412" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">月柱</text>
<rect x="200" y="420" width="52" height="32" rx="6" fill="var(--sunk, #efe8dc)"/>
<rect x="200" y="458" width="52" height="32" rx="6" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2" stroke-dasharray="5 4"/><text x="226" y="479" font-size="12" text-anchor="middle" fill="var(--sui, #2854a0)">？</text>
<text x="284" y="412" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">年柱</text>
<rect x="258" y="420" width="52" height="32" rx="6" fill="var(--sunk, #efe8dc)"/>
<rect x="258" y="458" width="52" height="32" rx="6" fill="var(--sun-soft, #f6ead0)" stroke="var(--sun, #d9a441)" stroke-width="2.5"/><text x="284" y="479" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink, #26221d)">年支</text>
<text x="38" y="520" font-size="14" font-weight="700" fill="var(--do, #a87018)">駅馬・咸池（桃花）・華蓋</text>
<text x="38" y="568" font-size="12" fill="var(--ink-soft, #6a6157)">年支から見たら日支も、日支から見たら年支もさがす</text>
<text x="38" y="588" font-size="12" fill="var(--ink-soft, #6a6157)">札：［月柱・年支基準］［時柱・日支基準］</text>
<rect x="410" y="356" width="370" height="246" rx="14" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="1.5"/>
<text x="428" y="386" font-size="16" font-weight="700" fill="var(--ink, #26221d)">④ 日柱の干支そのものを見る</text>
<text x="428" y="443" font-size="12" fill="var(--ink-soft, #6a6157)">天干</text><text x="428" y="481" font-size="12" fill="var(--ink-soft, #6a6157)">地支</text>
<text x="500" y="412" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">時柱</text>
<rect x="474" y="420" width="52" height="32" rx="6" fill="var(--sunk, #efe8dc)"/>
<rect x="474" y="458" width="52" height="32" rx="6" fill="var(--sunk, #efe8dc)"/>
<text x="558" y="412" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">日柱</text>
<rect x="532" y="420" width="52" height="32" rx="6" fill="var(--sun-soft, #f6ead0)" stroke="var(--sun, #d9a441)" stroke-width="2.5"/><text x="558" y="441" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink, #26221d)">日干</text>
