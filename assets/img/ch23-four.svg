<text x="674" y="152" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">年柱</text>
<rect x="648" y="160" width="52" height="32" rx="6" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2" stroke-dasharray="5 4"/><text x="674" y="181" font-size="12" text-anchor="middle" fill="var(--sui, #2854a0)">？</text>
<rect x="648" y="198" width="52" height="32" rx="6" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2" stroke-dasharray="5 4"/><text x="674" y="219" font-size="12" text-anchor="middle" fill="var(--sui, #2854a0)">？</text>
<text x="428" y="260" font-size="14" font-weight="700" fill="var(--do, #a87018)">天徳貴人（天干か地支）</text>
<text x="428" y="282" font-size="14" font-weight="700" fill="var(--do, #a87018)">月徳貴人（天干だけ）</text>
<text x="428" y="308" font-size="12" fill="var(--ink-soft, #6a6157)">天干で見つかると、札に（天干）がつく</text>
<text x="428" y="328" font-size="12" fill="var(--ink-soft, #6a6157)">札：［日柱（天干）］［日柱］</text>
<rect x="20" y="356" width="370" height="246" rx="14" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="1.5"/>
<text x="38" y="386" font-size="16" font-weight="700" fill="var(--ink, #26221d)">③ 年支・日支 から、ほかの地支を見る</text>
<text x="38" y="443" font-size="12" fill="var(--ink-soft, #6a6157)">天干</text><text x="38" y="481" font-size="12" fill="var(--ink-soft, #6a6157)">地支</text>
<text x="110" y="412" font-size="12" text-anchor="middle" fill="var(--ink-soft, #6a6157)">時柱</text>
<rect x="84" y="420" width="52" height="32" rx="6" fill="var(--sunk, #efe8dc)"/>
