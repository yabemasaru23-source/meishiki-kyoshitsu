<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="十二支の時計。円の真上が子で、時計回りに丑・寅・卯・辰・巳・午・未・申・酉・戌・亥と並ぶ。それぞれのマスに、読みと動物、時刻、月が書いてある。子は23〜1時・12月、丑は1〜3時・1月、寅は3〜5時・2月、卯は5〜7時・3月、辰は7〜9時・4月、巳は9〜11時・5月、午は11〜13時・6月、未は13〜15時・7月、申は15〜17時・8月、酉は17〜19時・9月、戌は19〜21時・10月、亥は21〜23時・11月。マスの色は五行で、亥・子が水、寅・卯が木、巳・午が火、申・酉が金、丑・辰・未・戌が土。円の外に方角があり、子が北、卯が東、午が南、酉が西。円の内側は、上が冬（水）、右が春（木）、下が夏（火）、左が秋（金）、真ん中に「土は季節の変わり目」。漢字の右上の＋と−は、アプリと同じ陰陽（子から交互に＋・−）">
