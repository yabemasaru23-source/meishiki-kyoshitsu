<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="3つのたとえを並べた図。左は地図で、命式＝生まれ持った地図、一生変わらない。まんなかは太陽と雲で、大運＝10年ごとの天気（季節）、10年で切りかわる。右は傘と小さな太陽で、年運＝1年ごとの天気、毎年切りかわる。下に、地図は同じでも天気に合わせて歩き方を選べる、と書いてある">
<rect width="800" height="320" rx="18" fill="var(--surface, #fffdf8)"/>
<g font-family="Zen Maru Gothic, sans-serif" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round">
  <!-- パネル -->
  <rect x="20" y="20" width="240" height="240" rx="14" fill="var(--sunk, #efe8dc)" stroke="var(--do, #a87018)" stroke-width="2.5"/>
  <rect x="280" y="20" width="240" height="240" rx="14" fill="var(--sunk, #efe8dc)" stroke="var(--sui, #2854a0)" stroke-width="2.5"/>
  <rect x="540" y="20" width="240" height="240" rx="14" fill="var(--sunk, #efe8dc)" stroke="var(--ka, #c03430)" stroke-width="2.5"/>
  <!-- 地図の絵 -->
  <path d="M80 60 L120 50 L160 60 L200 50 V130 L160 140 L120 130 L80 140 Z" fill="var(--sun-soft, #f6ead0)" stroke="var(--do, #a87018)" stroke-width="2.5"/>
  <path d="M120 50 V130 M160 60 V140" stroke="var(--do, #a87018)" stroke-width="1.5" fill="none" opacity=".6"/>
  <path d="M90 118 Q115 92 140 104 T190 76" stroke="var(--warm, #c03430)" stroke-width="2.5" fill="none" stroke-dasharray="4 5"/>
  <circle cx="190" cy="76" r="6" fill="var(--warm, #c03430)"/>
  <!-- 10年の天気（太陽と雲） -->
  <circle cx="375" cy="85" r="24" fill="var(--sun, #d9a441)"/>
  <g stroke="var(--sun, #d9a441)" stroke-width="3">
    <path d="M375 49 V41 M339 85 H331 M350 60 L344 54 M400 60 L406 54"/>
  </g>
  <path d="M392 128 Q384 104 408 102 Q416 84 438 92 Q458 88 460 108 Q478 112 470 128 Z" fill="var(--surface, #fffdf8)" stroke="var(--sui, #2854a0)" stroke-width="2.5"/>
  <!-- 1年の天気（傘と小さな太陽） -->
  <path d="M610 100 Q660 52 710 100 Z" fill="var(--ka, #c03430)" opacity=".85"/>
  <path d="M660 100 V132 Q660 140 652 140 Q646 140 646 134" stroke="var(--ink-soft, #6a6157)" stroke-width="3" fill="none"/>
  <circle cx="724" cy="60" r="12" fill="var(--sun, #d9a441)"/>
  <!-- 文字 -->
  <text x="140" y="180" font-size="22" font-weight="700" fill="var(--ink, #26221d)">命式 ＝ 地図</text>
  <text x="140" y="210" font-size="14" fill="var(--ink-soft, #6a6157)">生まれ持ったもの</text>
  <text x="140" y="234" font-size="14" fill="var(--ink-soft, #6a6157)">一生変わらない</text>
  <text x="400" y="180" font-size="22" font-weight="700" fill="var(--ink, #26221d)">大運 ＝ 10年の天気</text>
  <text x="400" y="210" font-size="14" fill="var(--ink-soft, #6a6157)">季節のような大きな流れ</text>
  <text x="400" y="234" font-size="14" fill="var(--ink-soft, #6a6157)">10年ごとに切りかわる</text>
  <text x="660" y="180" font-size="22" font-weight="700" fill="var(--ink, #26221d)">年運 ＝ 1年の天気</text>
  <text x="660" y="210" font-size="14" fill="var(--ink-soft, #6a6157)">その年の空もよう</text>
  <text x="660" y="234" font-size="14" fill="var(--ink-soft, #6a6157)">毎年切りかわる</text>
  <text x="400" y="296" font-size="16" fill="var(--ink, #26221d)">地図は同じでも、天気に合わせて「歩き方」を選べる</text>
</g>
</svg>
