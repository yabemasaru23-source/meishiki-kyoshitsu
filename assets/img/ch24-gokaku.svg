<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-label="五格の出し方の図。小川 日和の4文字が左から並び、画数は小3・川3・日4・和8。上の段で、姓の小川をまとめて天格3＋3＝6、名の日和をまとめて地格4＋8＝12。下の段で、姓の最後の字の川と名の最初の字の日をつないで人格3＋4＝7、外がわの小と和をつないで外格6＋12−7＝11。いちばん下に、全部の字を足して総格3＋3＋4＋8＝18。一字の姓・名には霊数1を足し、霊数は総格には入れない、という注意">
<rect width="800" height="410" rx="18" fill="var(--sunk, #efe8dc)"/>
<g font-family="Zen Maru Gothic, sans-serif" text-anchor="middle">
  <!-- 天格・地格（上） -->
  <text x="260" y="44" font-size="13" fill="var(--ink-soft, #6a6157)">姓（苗字）</text>
  <text x="540" y="44" font-size="13" fill="var(--ink-soft, #6a6157)">名（名前）</text>
  <text x="260" y="78" font-size="18" font-weight="700" fill="var(--sui, #2854a0)">天格　3＋3＝6</text>
  <text x="540" y="78" font-size="18" font-weight="700" fill="var(--moku, #2d7a4a)">地格　4＋8＝12</text>
  <path d="M160 106 V92 H360 V106" fill="none" stroke="var(--sui, #2854a0)" stroke-width="3"/>
  <path d="M440 106 V92 H640 V106" fill="none" stroke="var(--moku, #2d7a4a)" stroke-width="3"/>
  <!-- 4つの字 -->
  <g>
    <rect x="155" y="115" width="90" height="100" rx="10" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="1.5"/>
    <text x="200" y="174" font-size="46" font-weight="700" font-family="Zen Old Mincho, serif" fill="var(--ink, #26221d)">小</text>
    <text x="200" y="204" font-size="14" fill="var(--ink-soft, #6a6157)">3画</text>
    <rect x="275" y="115" width="90" height="100" rx="10" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="1.5"/>
    <text x="320" y="174" font-size="46" font-weight="700" font-family="Zen Old Mincho, serif" fill="var(--ink, #26221d)">川</text>
    <text x="320" y="204" font-size="14" fill="var(--ink-soft, #6a6157)">3画</text>
    <rect x="435" y="115" width="90" height="100" rx="10" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="1.5"/>
    <text x="480" y="174" font-size="46" font-weight="700" font-family="Zen Old Mincho, serif" fill="var(--ink, #26221d)">日</text>
    <text x="480" y="204" font-size="14" fill="var(--ink-soft, #6a6157)">4画</text>
    <rect x="555" y="115" width="90" height="100" rx="10" fill="var(--surface, #fffdf8)" stroke="var(--ink-soft, #6a6157)" stroke-width="1.5"/>
    <text x="600" y="174" font-size="46" font-weight="700" font-family="Zen Old Mincho, serif" fill="var(--ink, #26221d)">和</text>
    <text x="600" y="204" font-size="14" fill="var(--ink-soft, #6a6157)">8画</text>
  </g>
  <!-- 人格（つなぎ目） -->
  <path d="M320 222 V240 H480 V222" fill="none" stroke="var(--warm, #c03430)" stroke-width="3"/>
  <text x="400" y="264" font-size="17" font-weight="700" fill="var(--warm, #c03430)">人格　3＋4＝7</text>
  <!-- 外格（外がわ） -->
  <path d="M200 222 V284 H600 V222" fill="none" stroke="var(--do, #a87018)" stroke-width="3"/>
  <text x="400" y="308" font-size="17" font-weight="700" fill="var(--do, #a87018)">外格　6＋12−7＝11</text>
  <text x="112" y="250" font-size="13" fill="var(--ink-soft, #6a6157)">つなぎ目が人</text>
  <text x="112" y="268" font-size="13" fill="var(--ink-soft, #6a6157)">外がわが外</text>
  <!-- 総格 -->
  <rect x="140" y="322" width="520" height="40" rx="20" fill="var(--surface, #fffdf8)" stroke="var(--kin, #6b7584)" stroke-width="2.5"/>
  <text x="400" y="348" font-size="17" font-weight="700" fill="var(--kin, #6b7584)">総格＝全部の字　3＋3＋4＋8＝18</text>
  <text x="400" y="392" font-size="13" fill="var(--ink-soft, #6a6157)">一字の姓・名には「霊数1」を足す（天格・地格・外格に入り、総格には入れない）</text>
</g>
</svg>
