<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="4つのたまごが横に並んでいる。左から時柱の未、日柱の酉、月柱の巳、年柱の寅。どのたまごも、殻に大きく地支が書かれ、その下の小さな窓から中身の蔵干がのぞいている。未の中に丁、酉の中に庚、巳の中に庚、寅の中に丙。上に「見える字の、中にある字」と書かれている">
<rect width="800" height="320" fill="var(--sun-soft, #f6ead0)"/>
<g font-family="Zen Maru Gothic, sans-serif" text-anchor="middle">
  <text x="400" y="46" font-size="24" font-weight="700" fill="var(--ink, #26221d)">見える字の、中にある字</text>
  <text x="400" y="76" font-size="15" fill="var(--ink-soft, #6a6157)">地支（下の字）の中には、天干が1つかくれている</text>
  <!-- 床 -->
  <rect x="80" y="252" width="640" height="8" rx="4" fill="var(--sunk, #efe8dc)"/>
  <!-- 時柱 未 / 丁 -->
  <ellipse cx="160" cy="176" rx="56" ry="72" fill="var(--surface, #fffdf8)" stroke="var(--do, #a87018)" stroke-width="3"/>
  <text x="160" y="160" font-size="40" font-weight="900" fill="var(--do, #a87018)" font-family="Zen Old Mincho, serif">未</text>
  <circle cx="160" cy="204" r="25" fill="var(--sunk, #efe8dc)" stroke="var(--ka, #c03430)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="160" y="213" font-size="24" font-weight="700" fill="var(--ka, #c03430)" font-family="Zen Old Mincho, serif">丁</text>
  <text x="160" y="290" font-size="17" font-weight="700" fill="var(--ink, #26221d)" font-family="Zen Old Mincho, serif">時柱</text>
  <!-- 日柱 酉 / 庚 -->
  <ellipse cx="320" cy="176" rx="56" ry="72" fill="var(--surface, #fffdf8)" stroke="var(--kin, #6b7584)" stroke-width="3"/>
  <text x="320" y="160" font-size="40" font-weight="900" fill="var(--kin, #6b7584)" font-family="Zen Old Mincho, serif">酉</text>
  <circle cx="320" cy="204" r="25" fill="var(--sunk, #efe8dc)" stroke="var(--kin, #6b7584)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="320" y="213" font-size="24" font-weight="700" fill="var(--kin, #6b7584)" font-family="Zen Old Mincho, serif">庚</text>
  <text x="320" y="290" font-size="17" font-weight="700" fill="var(--ink, #26221d)" font-family="Zen Old Mincho, serif">日柱</text>
  <!-- 月柱 巳 / 庚 -->
  <ellipse cx="480" cy="176" rx="56" ry="72" fill="var(--surface, #fffdf8)" stroke="var(--ka, #c03430)" stroke-width="3"/>
  <text x="480" y="160" font-size="40" font-weight="900" fill="var(--ka, #c03430)" font-family="Zen Old Mincho, serif">巳</text>
  <circle cx="480" cy="204" r="25" fill="var(--sunk, #efe8dc)" stroke="var(--kin, #6b7584)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="480" y="213" font-size="24" font-weight="700" fill="var(--kin, #6b7584)" font-family="Zen Old Mincho, serif">庚</text>
  <text x="480" y="290" font-size="17" font-weight="700" fill="var(--ink, #26221d)" font-family="Zen Old Mincho, serif">月柱</text>
  <!-- 年柱 寅 / 丙 -->
  <ellipse cx="640" cy="176" rx="56" ry="72" fill="var(--surface, #fffdf8)" stroke="var(--moku, #2d7a4a)" stroke-width="3"/>
  <text x="640" y="160" font-size="40" font-weight="900" fill="var(--moku, #2d7a4a)" font-family="Zen Old Mincho, serif">寅</text>
  <circle cx="640" cy="204" r="25" fill="var(--sunk, #efe8dc)" stroke="var(--ka, #c03430)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="640" y="213" font-size="24" font-weight="700" fill="var(--ka, #c03430)" font-family="Zen Old Mincho, serif">丙</text>
  <text x="640" y="290" font-size="17" font-weight="700" fill="var(--ink, #26221d)" font-family="Zen Old Mincho, serif">年柱</text>
</g>
</svg>
