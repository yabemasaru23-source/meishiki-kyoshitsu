  <text x="400" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--do, #a87018)">土</text>
  <rect x="427" y="214" width="26" height="36" rx="3" fill="none" stroke="var(--kin, #6b7584)" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="440" y="204" font-size="14" font-weight="700" fill="var(--kin, #6b7584)">0</text>
  <text x="440" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--kin, #6b7584)">金</text>
  <rect x="467" y="106" width="26" height="144" rx="3" fill="var(--sui, #2854a0)" opacity="0.9"/>
  <text x="480" y="96" font-size="14" font-weight="700" fill="var(--ink, #26221d)">4</text>
  <text x="480" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--sui, #2854a0)">水</text>
  <text x="400" y="306" font-size="13" fill="var(--ink, #26221d)">水4が得意技・金0が空き</text>
  <text x="400" y="326" font-size="13" fill="var(--ink-soft, #6a6157)">土2が金のお母さん役</text>
  <rect x="540" y="16" width="240" height="328" rx="14" fill="none" stroke="var(--sunk, #efe8dc)" stroke-width="2"/>
  <text x="660" y="44" font-size="15" font-weight="700" fill="var(--ink, #26221d)">れんさん（日干 癸）</text>
