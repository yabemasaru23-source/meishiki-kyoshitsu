  <text x="100" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--ka, #c03430)">火</text>
  <rect x="127" y="178" width="26" height="72" rx="3" fill="var(--do, #a87018)" opacity="0.55"/>
  <text x="140" y="168" font-size="14" font-weight="700" fill="var(--ink, #26221d)">2</text>
  <text x="140" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--do, #a87018)">土</text>
  <rect x="167" y="178" width="26" height="72" rx="3" fill="var(--kin, #6b7584)" opacity="0.55"/>
