<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="3人の五行バランスの棒グラフ。ひよりさんは木2・火2・土2・金2・水0で、水は点線の空いた引き出し、金2が水のお母さん役。そうたさんは木1・火1・土2・金0・水4で、水が得意技、金が空き、土2が金のお母さん役。れんさんは木0・火0・土4・金3・水1で、土が得意技、木と火が空き、土から金、金から水へ流れる道が強い">
<rect width="800" height="360" rx="18" fill="var(--surface, #fffdf8)"/>
<g font-family="Zen Maru Gothic, sans-serif" text-anchor="middle">
  <rect x="20" y="16" width="240" height="328" rx="14" fill="none" stroke="var(--sunk, #efe8dc)" stroke-width="2"/>
  <text x="140" y="44" font-size="15" font-weight="700" fill="var(--ink, #26221d)">ひよりさん（日干 辛）</text>
  <path d="M38 250 H242" stroke="var(--ink-soft, #6a6157)" stroke-width="1.5"/>
