  <text x="180" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--kin, #6b7584)">金</text>
  <rect x="207" y="214" width="26" height="36" rx="3" fill="none" stroke="var(--sui, #2854a0)" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="220" y="204" font-size="14" font-weight="700" fill="var(--sui, #2854a0)">0</text>
  <text x="220" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--sui, #2854a0)">水</text>
  <text x="140" y="306" font-size="13" fill="var(--ink, #26221d)">水0：まだ空いた引き出し</text>
  <text x="140" y="326" font-size="13" fill="var(--ink-soft, #6a6157)">金2が水のお母さん役</text>
