  <text x="620" y="204" font-size="14" font-weight="700" fill="var(--ka, #c03430)">0</text>
  <text x="620" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--ka, #c03430)">火</text>
  <rect x="647" y="106" width="26" height="144" rx="3" fill="var(--do, #a87018)" opacity="0.9"/>
  <text x="660" y="96" font-size="14" font-weight="700" fill="var(--ink, #26221d)">4</text>
  <text x="660" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--do, #a87018)">土</text>
  <rect x="687" y="142" width="26" height="108" rx="3" fill="var(--kin, #6b7584)" opacity="0.9"/>
  <text x="700" y="132" font-size="14" font-weight="700" fill="var(--ink, #26221d)">3</text>
  <text x="700" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--kin, #6b7584)">金</text>
  <rect x="727" y="214" width="26" height="36" rx="3" fill="var(--sui, #2854a0)" opacity="0.55"/>
  <text x="740" y="204" font-size="14" font-weight="700" fill="var(--ink, #26221d)">1</text>
  <text x="740" y="276" font-size="18" font-family="Zen Old Mincho, serif" font-weight="700" fill="var(--sui, #2854a0)">水</text>
  <text x="660" y="306" font-size="13" fill="var(--ink, #26221d)">土4が得意技・木0火0が空き</text>
  <text x="660" y="326" font-size="13" fill="var(--ink-soft, #6a6157)">土→金→水の流れが強い</text>
